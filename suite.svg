<!-- window chrome -->
<rect width="660" height="368" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<rect width="660" height="32" rx="8" fill="#161b22"/>
<rect y="24" width="660" height="8" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/>
<circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text class="t" x="330" y="21" text-anchor="middle" fill="#6e7681" font-size="11">goweft &#x2014; agent supply chain, end to end</text>

<defs><clipPath id="cp"><rect x="1" y="33" width="658" height="334"/></clipPath></defs>
<g clip-path="url(#cp)">

<!-- tenter: pre-publish -->
<text class="t" x="16" y="56" opacity="0" style="animation:a1 16s infinite"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> tenter scan ./payments-sdk</tspan></text>
<text class="t" x="32" y="74" fill="#ff7b72" opacity="0" style="animation:a2 16s infinite">&#x2716; [SEC-002] .env &#x2014; AWS Access Key ID detected</text>
<text class="t" x="32" y="92" fill="#ff7b72" opacity="0" style="animation:a3 16s infinite">&#x2716; BLOCKED: 3 finding(s). DO NOT PUBLISH.</text>

<!-- heddle: runtime -->
<text class="t" x="16" y="118" opacity="0" style="animation:a4 16s infinite"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> heddle serve --policy default.yaml</tspan></text>
<text class="t" x="32" y="136" fill="#ff7b72" opacity="0" style="animation:a5 16s infinite">&#x2716; fs.write denied &#x2014; tier T3 (untrusted), policy: read-only</text>
<text class="t" x="32" y="154" fill="#3fb950" opacity="0" style="animation:a6 16s infinite">&#x2713; decision logged to audit trail</text>

<!-- ratine: across sessions -->
<text class="t" x="16" y="180" opacity="0" style="animation:a7 16s infinite"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> ratine scan ~/.agent/memory/</tspan></text>
<text class="t" x="32" y="198" fill="#e3b341" opacity="0" style="animation:a8 16s infinite">&#x26a0; [INJ-004] persisted instruction: "ignore prior safety&#x2026;"</text>
<text class="t" x="32" y="216" fill="#e3b341" opacity="0" style="animation:a9 16s infinite">&#x26a0; belief drift: 2 entries contradict their sources</text>

<!-- unshear: post-fork -->
<text class="t" x="16" y="242" opacity="0" style="animation:a10 16s infinite"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> unshear diff upstream/agent ./fork</tspan></text>
<text class="t" x="32" y="260" fill="#ff7b72" opacity="0" style="animation:a11 16s infinite">&#x2716; removed: rate_limiter.py &#x2014; throttling guard stripped</text>
<text class="t" x="32" y="278" fill="#ff7b72" opacity="0" style="animation:a12 16s infinite">&#x2716; auth middleware disabled in 2 routes</text>

<!-- crocking: in git history -->
<text class="t" x="16" y="304" opacity="0" style="animation:a13 16s infinite"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> crocking analyze ./repo --since v1.2</tspan></text>
<text class="t" x="32" y="322" fill="#e3b341" opacity="0" style="animation:a14 16s infinite">&#x25cf; 74% AI-authored &#x2014; burst timing, tool markers, style drift</text>

<text class="t" x="16" y="350" fill="#6e7681" opacity="0" style="animation:a15 16s infinite">&#x2500;&#x2500;&#x2500;&#x2500; 5 tools &#xb7; one supply chain &#xb7; goweft &#x2500;&#x2500;&#x2500;&#x2500;</text>

</g>
</svg>
